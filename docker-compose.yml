version: '3.8'

services:
  # Main service: Streamlit dashboard for inference
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-risk-dashboard
    ports:
      - "8501:8501"
    volumes:
      # Mount data directories for persistence
      - ./medical_risk_predictor/data/raw:/app/medical_risk_predictor/data/raw
      - ./medical_risk_predictor/data/processed:/app/medical_risk_predictor/data/processed
      - ./medical_risk_predictor/models/saved_models:/app/medical_risk_predictor/models/saved_models
      - ./medical_risk_predictor/reports/generated:/app/medical_risk_predictor/reports/generated
      # Mount kaggle credentials if available
      - ~/.kaggle:/home/mluser/.kaggle:ro
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    command: streamlit run medical_risk_predictor/dashboard/app.py
    restart: unless-stopped
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Training service: Run model training pipeline (one-shot, then exits)
  training:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-risk-training
    volumes:
      - ./medical_risk_predictor/data/raw:/app/medical_risk_predictor/data/raw
      - ./medical_risk_predictor/data/processed:/app/medical_risk_predictor/data/processed
      - ./medical_risk_predictor/models/saved_models:/app/medical_risk_predictor/models/saved_models
      - ./medical_risk_predictor/reports/generated:/app/medical_risk_predictor/reports/generated
      - ~/.kaggle:/home/mluser/.kaggle:ro
    environment:
      - KAGGLE_CONFIG_DIR=/home/mluser/.kaggle
    command: python medical_risk_predictor/scripts/train_and_evaluate.py
    restart: "no"
    networks:
      - ml-network
    profiles:
      - training  # Use: docker-compose --profile training up training

  # Data preparation service: Fetch and prepare datasets (one-shot)
  prepare-data:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-risk-prepare-data
    volumes:
      - ./medical_risk_predictor/data/raw:/app/medical_risk_predictor/data/raw
      - ./medical_risk_predictor/data/processed:/app/medical_risk_predictor/data/processed
      - ~/.kaggle:/home/mluser/.kaggle:ro
    environment:
      - KAGGLE_CONFIG_DIR=/home/mluser/.kaggle
    command: python medical_risk_predictor/scripts/prepare_datasets.py --include-kaggle
    restart: "no"
    networks:
      - ml-network
    profiles:
      - data-prep  # Use: docker-compose --profile data-prep up prepare-data

  # Full pipeline: Data prep + Training (one-shot)
  full-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-risk-full-pipeline
    volumes:
      - ./medical_risk_predictor/data/raw:/app/medical_risk_predictor/data/raw
      - ./medical_risk_predictor/data/processed:/app/medical_risk_predictor/data/processed
      - ./medical_risk_predictor/models/saved_models:/app/medical_risk_predictor/models/saved_models
      - ./medical_risk_predictor/reports/generated:/app/medical_risk_predictor/reports/generated
      - ~/.kaggle:/home/mluser/.kaggle:ro
    environment:
      - KAGGLE_CONFIG_DIR=/home/mluser/.kaggle
    command: python medical_risk_predictor/scripts/run_all.py --include-kaggle --no-dashboard
    restart: "no"
    networks:
      - ml-network
    profiles:
      - pipeline  # Use: docker-compose --profile pipeline up full-pipeline

  # Jupyter notebook service for interactive exploration
  notebook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-risk-notebook
    ports:
      - "8888:8888"
    volumes:
      - ./medical_risk_predictor:/app/medical_risk_predictor
      - ~/.kaggle:/home/mluser/.kaggle:ro
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
    restart: unless-stopped
    networks:
      - ml-network
    profiles:
      - notebook  # Use: docker-compose --profile notebook up notebook

networks:
  ml-network:
    driver: bridge
